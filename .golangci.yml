version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: UK
      # Comments only: identifiers such as image/color cannot be anglicised.
      mode: restricted
formatters:
  enable:
    - gofmt
    - goimports
